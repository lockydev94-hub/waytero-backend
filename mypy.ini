[mypy]
python_version = 3.13
ignore_missing_imports = True
warn_unused_configs = True

[mypy-app.modules.auth.models.*]
disable_error_code = var-annotated,return-value

[mypy-app.modules.auth.repositories.*]
disable_error_code = assignment,arg-type,return-value

[mypy-app.modules.auth.services.*]
disable_error_code = assignment,arg-type,return-value

# SQLAlchemy 1.x-style Column[...] attributes read back as Column, not the
# Python type, so every ORM attribute access trips assignment/arg-type. Same
# suppression the auth module already carries.
[mypy-app.modules.hotel.models]
disable_error_code = var-annotated,return-value

[mypy-app.modules.hotel.repositories]
disable_error_code = assignment,arg-type,return-value

[mypy-app.modules.hotel.services]
disable_error_code = assignment,arg-type,return-value

[mypy-app.modules.hotel.services.*]
disable_error_code = assignment,arg-type,return-value

# ── Per-module suppressions for SQLAlchemy/raw-SQL typing debt ──────────────
# Same rationale as the auth/hotel sections above: ORM Column attributes and
# dynamic dicts from raw SQL trip arg-type/assignment/attr-defined, so the
# systemic codes are disabled per module. Genuinely-new error codes in these
# modules will still surface.
[mypy-app.modules.admin]
disable_error_code = arg-type,assignment,call-arg,call-overload,no-redef,attr-defined,index,truthy-function,var-annotated,union-attr,return-value,misc,list-item,type-var
[mypy-app.modules.admin.*]
disable_error_code = arg-type,assignment,call-arg,call-overload,no-redef,attr-defined,index,truthy-function,var-annotated,union-attr,return-value,misc,list-item,type-var

[mypy-app.modules.auth.*]
disable_error_code = arg-type,assignment

[mypy-app.modules.booking]
disable_error_code = assignment,arg-type,return-value,index,attr-defined
[mypy-app.modules.booking.*]
disable_error_code = assignment,arg-type,return-value,index,attr-defined

[mypy-app.modules.chat]
disable_error_code = assignment,arg-type,misc,return-value,call-overload
[mypy-app.modules.chat.*]
disable_error_code = assignment,arg-type,misc,return-value,call-overload

[mypy-app.modules.customer]
disable_error_code = arg-type,assignment,call-arg
[mypy-app.modules.customer.*]
disable_error_code = arg-type,assignment,call-arg

[mypy-app.modules.driver]
disable_error_code = assignment,call-overload,return-value
[mypy-app.modules.driver.*]
disable_error_code = assignment,call-overload,return-value

[mypy-app.modules.hotel]
disable_error_code = call-arg,operator
[mypy-app.modules.hotel.*]
disable_error_code = call-arg,operator

[mypy-app.modules.notification]
disable_error_code = arg-type,assignment
[mypy-app.modules.notification.*]
disable_error_code = arg-type,assignment

[mypy-app.modules.partner]
disable_error_code = arg-type,assignment,call-overload,call-arg,return-value,index,union-attr,type-var
[mypy-app.modules.partner.*]
disable_error_code = arg-type,assignment,call-overload,call-arg,return-value,index,union-attr,type-var

[mypy-app.modules.tour]
disable_error_code = attr-defined,arg-type,assignment,call-overload,operator,list-item,type-var
[mypy-app.modules.tour.*]
disable_error_code = attr-defined,arg-type,assignment,call-overload,operator,list-item,type-var

[mypy-app.modules.vehicle]
disable_error_code = assignment,arg-type,call-arg,call-overload
[mypy-app.modules.vehicle.*]
disable_error_code = assignment,arg-type,call-arg,call-overload
